# Alembic configuration for the CaseLens API database.
#
# The database URL is NOT stored here. env.py reads it from the CASELENS_DATABASE_URL
# environment variable (SQLAlchemy URL, driver postgresql+psycopg), unless a caller injects
# `sqlalchemy.url` programmatically (the migration tests do this).
#
#   cd apps/api && CASELENS_DATABASE_URL=postgresql+psycopg://... alembic upgrade head
#   alembic -c apps/api/alembic.ini upgrade head --sql      # offline SQL, from the repo root

[alembic]
# Resolved relative to this file, so alembic works from any working directory.
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
