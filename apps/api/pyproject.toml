[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caselens-api"
version = "0.0.1"
description = "CaseLens HTTP API (FastAPI)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.146",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "sqlalchemy>=2.1",
  "alembic>=1.20",
  "psycopg[binary]>=3.3",
  "psycopg-pool>=3.2",
  "pyjwt[crypto]>=2.10",
  "python-multipart>=0.0.20",
  "minio>=7.2",
  "caselens-workers",  # storage keys, pipeline first stages
  "caselens-agent",  # investigator agent runner (/ask)
  "caselens-retrieval",  # agent search backends
  "caselens-semantic-layer",  # agent query_records backend
]

[tool.setuptools.packages.find]
include = ["caselens_api*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "py.typed"]
