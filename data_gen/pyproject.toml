[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caselens-data-gen"
version = "0.0.1"
description = "CaseLens synthetic case data generators (SYNTHETIC DATA ONLY)."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["caselens_data_gen*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "py.typed"]
