[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caselens-evals"
version = "0.0.1"
description = "CaseLens eval harness."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["caselens_evals*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "py.typed"]
