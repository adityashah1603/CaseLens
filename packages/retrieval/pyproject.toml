[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caselens-retrieval"
version = "0.0.1"
description = "CaseLens hybrid retrieval (pgvector + full-text, RRF, rerank)."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["caselens_retrieval*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "py.typed"]
