[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caselens-retrieval"
version = "0.0.1"
description = "CaseLens hybrid retrieval (pgvector + full-text, RRF, rerank)."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "psycopg[binary]>=3.2",
  "fastembed>=0.7",
]

[tool.setuptools.packages.find]
include = ["caselens_retrieval*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "py.typed"]
